<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SUDO 数豆｜预约演示后台</title>
    <link rel="stylesheet" href="./feedback.css?v=20260922-3" />
    <link rel="stylesheet" href="./styles.css?v=20260922-2" />
    <script src="./admin.js?v=20260922-1" defer></script>
    <script src="./feedback-admin.js?v=20260922-3" defer></script>
  </head>
  <body class="admin-page">
    <header class="admin-header">
      <a class="brand" href="/" aria-label="返回 SUDO 数豆首页">
        <img src="./assets/sudo-logo-gray-source.png" alt="SUDO 数豆科技" />
      </a>
      <div class="admin-header-actions">
        <div class="admin-view-tabs" role="tablist" aria-label="后台模块">
          <button id="admin-tab-requests" class="admin-view-tab is-active" type="button" role="tab" aria-controls="admin-dashboard" aria-selected="true" tabindex="0" data-admin-view="requests">
            <span class="admin-tab-label-full">预约演示后台</span><span class="admin-tab-label-short">预约后台</span><span class="admin-tab-label-tiny">预约</span>
          </button>
          <button id="admin-tab-feedback" class="admin-view-tab" type="button" role="tab" aria-controls="feedback-admin-dashboard" aria-selected="false" tabindex="-1" data-admin-view="feedback">
            <span class="admin-tab-label-full">问题反馈后台</span><span class="admin-tab-label-short">反馈后台</span><span class="admin-tab-label-tiny">反馈</span>
          </button>
        </div>
        <button class="admin-icon-button" id="admin-settings-open" type="button" aria-label="后台设置" title="后台设置">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 15.4A3.4 3.4 0 1 0 12 8.6a3.4 3.4 0 0 0 0 6.8Z" />
            <path d="M19.4 15a1.7 1.7 0 0 0 .34 1.88l.06.06a2.06 2.06 0 0 1-2.91 2.91l-.06-.06A1.7 1.7 0 0 0 15 19.4a1.7 1.7 0 0 0-1 .24 1.7 1.7 0 0 0-.82 1.46V21a2.06 2.06 0 0 1-4.12 0v-.1a1.7 1.7 0 0 0-.82-1.46 1.7 1.7 0 0 0-1-.24 1.7 1.7 0 0 0-1.88.34l-.06.06a2.06 2.06 0 0 1-2.91-2.91l.06-.06A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-.24-1 1.7 1.7 0 0 0-1.46-.82H3a2.06 2.06 0 0 1 0-4.12h.1a1.7 1.7 0 0 0 1.46-.82 1.7 1.7 0 0 0 .24-1 1.7 1.7 0 0 0-.34-1.88l-.06-.06a2.06 2.06 0 0 1 2.91-2.91l.06.06A1.7 1.7 0 0 0 9 4.6a1.7 1.7 0 0 0 1-.24A1.7 1.7 0 0 0 10.82 2.9V3a2.06 2.06 0 0 1 4.12 0v-.1a1.7 1.7 0 0 0 .82 1.46 1.7 1.7 0 0 0 1 .24 1.7 1.7 0 0 0 1.88-.34l.06-.06a2.06 2.06 0 0 1 2.91 2.91l-.06.06A1.7 1.7 0 0 0 19.4 9c.09.33.09.67 0 1a1.7 1.7 0 0 0 1.46.82h.1a2.06 2.06 0 0 1 0 4.12h-.1a1.7 1.7 0 0 0-1.46.82Z" />
          </svg>
        </button>
        <button class="admin-icon-button admin-header-logout" id="admin-logout" type="button" aria-label="退出登录" title="退出登录" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M10 6H6.8A1.8 1.8 0 0 0 5 7.8v8.4A1.8 1.8 0 0 0 6.8 18H10" />
            <path d="M14 8l4 4-4 4" />
            <path d="M9 12h9" />
          </svg>
        </button>
      </div>
    </header>

    <main class="admin-shell">
      <section class="admin-login" id="admin-login">
        <p class="eyebrow">Admin access</p>
        <h1 id="admin-login-title">查看预约线索</h1>
        <form class="admin-login-form" id="admin-login-form">
          <label>
            <span>后台密码</span>
            <input name="password" type="password" autocomplete="current-password" required />
          </label>
          <p class="admin-status" id="admin-login-status" role="status" aria-live="polite"></p>
          <button class="button primary" type="submit">进入后台</button>
        </form>
      </section>

      <section class="admin-dashboard" id="admin-dashboard" role="tabpanel" aria-labelledby="admin-tab-requests" hidden>
        <div class="admin-toolbar">
          <div>
            <p class="eyebrow">Demo requests</p>
            <h1>预约提交记录</h1>
          </div>
          <div class="admin-actions">
            <span class="admin-count" id="admin-count">0 条记录</span>
            <div class="admin-filter" role="group" aria-label="核实状态筛选">
              <button class="admin-filter-button active" type="button" data-filter="all">全部</button>
              <button class="admin-filter-button" type="button" data-filter="verified">已核实</button>
              <button class="admin-filter-button" type="button" data-filter="unverified">未核实</button>
            </div>
            <button class="button secondary" id="admin-refresh" type="button">刷新</button>
            <button class="button secondary admin-bulk-delete" id="admin-bulk-delete" type="button" disabled>删除选中</button>
            <a class="button secondary" href="/api/admin/demo-requests.csv">导出 CSV</a>
          </div>
        </div>
        <p class="admin-status" id="admin-dashboard-status" role="status" aria-live="polite"></p>
        <div class="admin-table-wrap">
          <table class="admin-table">
            <colgroup>
              <col class="admin-col-select" />
              <col class="admin-col-time" />
              <col class="admin-col-name" />
              <col class="admin-col-phone" />
              <col class="admin-col-company" />
              <col class="admin-col-industry" />
              <col class="admin-col-message" />
              <col class="admin-col-action" />
            </colgroup>
            <thead>
              <tr>
                <th class="admin-select-cell">
                  <input id="admin-select-all" type="checkbox" aria-label="全选预约记录" />
                </th>
                <th>提交时间</th>
                <th>姓名</th>
                <th>手机号</th>
                <th>公司名称</th>
                <th>所属行业</th>
                <th>需求备注</th>
                <th class="admin-action-heading">操作</th>
              </tr>
            </thead>
            <tbody id="admin-requests-body"></tbody>
          </table>
          <div class="admin-empty" id="admin-empty" hidden>暂无预约提交记录</div>
        </div>
      </section>

      <section class="feedback-admin-dashboard admin-feedback-panel" id="feedback-admin-dashboard" role="tabpanel" aria-labelledby="admin-tab-feedback" hidden>
        <div class="feedback-admin-toolbar">
          <div>
            <p>Product feedback</p>
            <h1>意见反馈记录</h1>
          </div>
          <div class="feedback-admin-tools">
            <span id="feedback-admin-count">0 条反馈</span>
            <div class="feedback-admin-filters" role="group" aria-label="反馈类型筛选">
              <button class="active" type="button" data-type-filter="all">全部</button>
              <button type="button" data-type-filter="issue">问题</button>
              <button type="button" data-type-filter="suggestion">建议</button>
            </div>
            <label class="feedback-admin-status-filter">
              <span>状态</span>
              <select id="feedback-admin-status-filter">
                <option value="all">全部状态</option>
                <option value="pending_evaluation">待评估</option>
                <option value="evaluated_pending">已评估待定</option>
                <option value="adopted">已采纳</option>
                <option value="resolved">已解决</option>
                <option value="launched">已上线</option>
              </select>
            </label>
            <label class="feedback-admin-select-all" title="全选当前筛选结果">
              <input id="feedback-admin-select-all" type="checkbox" aria-label="全选当前筛选的反馈记录" />
            </label>
            <button class="feedback-admin-icon-button feedback-admin-delete-button" id="feedback-admin-bulk-delete" type="button" aria-label="删除选中反馈" title="删除选中反馈" disabled>
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18M8 6V4.8A1.8 1.8 0 0 1 9.8 3h4.4A1.8 1.8 0 0 1 16 4.8V6M18.5 6l-.9 13.1A2 2 0 0 1 15.6 21H8.4a2 2 0 0 1-2-1.9L5.5 6M10 11v5m4-5v5" /></svg>
            </button>
            <button class="feedback-admin-refresh" id="feedback-admin-refresh" type="button">刷新</button>
          </div>
        </div>
        <p class="feedback-admin-status" id="feedback-admin-dashboard-status" role="status" aria-live="polite"></p>
        <div class="feedback-admin-list" id="feedback-admin-list"></div>
        <div class="feedback-admin-empty" id="feedback-admin-empty" hidden>暂无符合条件的反馈</div>
        <dialog class="feedback-admin-image-dialog" id="feedback-admin-image-dialog" aria-labelledby="feedback-admin-image-title">
          <div class="feedback-admin-dialog-header">
            <strong id="feedback-admin-image-title">反馈截图</strong>
            <button type="button" data-feedback-image-close aria-label="关闭截图预览" title="关闭">×</button>
          </div>
          <p class="feedback-admin-image-status" id="feedback-admin-image-status" role="status"></p>
          <img id="feedback-admin-image" alt="" hidden />
        </dialog>
        <dialog class="feedback-admin-delete-dialog" id="feedback-admin-delete-dialog" aria-labelledby="feedback-admin-delete-title">
          <div class="feedback-admin-dialog-header">
            <strong id="feedback-admin-delete-title">确认删除反馈</strong>
            <button type="button" data-feedback-delete-close aria-label="关闭删除确认" title="关闭">×</button>
          </div>
          <p id="feedback-admin-delete-intro"></p>
          <ul id="feedback-admin-delete-list"></ul>
          <p class="feedback-admin-status" id="feedback-admin-delete-status" role="status" aria-live="polite"></p>
          <div class="feedback-admin-delete-actions">
            <button type="button" data-feedback-delete-close>取消</button>
            <button type="button" id="feedback-admin-confirm-delete">确认删除</button>
          </div>
        </dialog>
      </section>

      <div class="admin-settings-modal" id="admin-settings" aria-hidden="true">
        <div class="admin-settings-backdrop" data-settings-close></div>
        <section class="admin-settings-dialog" role="dialog" aria-modal="true" aria-labelledby="admin-settings-title">
          <button class="demo-close" type="button" aria-label="关闭设置" data-settings-close>×</button>
          <div>
            <p class="eyebrow">Security</p>
            <h2 id="admin-settings-title">后台设置</h2>
            <p class="admin-settings-intro">管理后台访问密码。修改成功后需要重新登录。</p>
          </div>
          <form class="admin-password-form" id="admin-password-form">
            <label>
              <span>当前密码</span>
              <input name="currentPassword" type="password" autocomplete="current-password" required />
            </label>
            <label>
              <span>新密码</span>
              <input name="newPassword" type="password" autocomplete="new-password" minlength="8" required />
            </label>
            <label>
              <span>确认新密码</span>
              <input name="confirmPassword" type="password" autocomplete="new-password" minlength="8" required />
            </label>
            <p class="admin-status" id="admin-password-status" role="status" aria-live="polite"></p>
            <button class="button primary" type="submit">保存新密码</button>
          </form>
        </section>
      </div>

      <div class="admin-delete-modal" id="admin-delete-modal" aria-hidden="true">
        <div class="admin-delete-backdrop" data-delete-close></div>
        <section class="admin-delete-dialog" role="dialog" aria-modal="true" aria-labelledby="admin-delete-title">
          <button class="demo-close" type="button" aria-label="关闭删除确认" data-delete-close>×</button>
          <p class="eyebrow">Delete confirmation</p>
          <h2 id="admin-delete-title">确认删除预约记录</h2>
          <p class="admin-delete-intro" id="admin-delete-intro"></p>
          <div class="admin-delete-list" id="admin-delete-list"></div>
          <p class="admin-status" id="admin-delete-status" role="status" aria-live="polite"></p>
          <div class="admin-delete-actions">
            <button class="button secondary" type="button" data-delete-close>取消</button>
            <button class="button primary admin-confirm-delete" id="admin-confirm-delete" type="button">确认删除</button>
          </div>
        </section>
      </div>
    </main>
  </body>
</html>
